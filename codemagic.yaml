workflows:
  ios-workflow:
    name: iOS Build
    environment:
      flutter: stable

    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign
      - mkdir -p Payload
      - cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
      - zip -r unsigned.ipa Payload

    artifacts:
      - unsigned.ipa